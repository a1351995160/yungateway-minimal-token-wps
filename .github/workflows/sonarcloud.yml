name: SonarQube Cloud

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  sonarcloud:
    name: Build, P3C PMD, SpotBugs, and SonarQube Cloud
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: yundoc_test
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Ensure SonarCloud Java rules
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: a1351995160_yungateway-minimal-token-wps
        run: |
          python3 scripts/ensure_sonarcloud_rules.py || \
            echo "::warning::SONAR_TOKEN cannot manage SonarCloud quality profiles; local PMD and SpotBugs checks remain enforced."

      - name: Build and run local static checks
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify pmd:pmd pmd:check spotbugs:check

      - name: Scan with SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.token=${SONAR_TOKEN} \
              -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
              -Dsonar.projectKey=a1351995160_yungateway-minimal-token-wps \
              -Dsonar.projectName=yungateway-minimal-token-wps \
              -Dsonar.java.pmd.reportPaths=target/pmd.xml \
              -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml && exit 0

            if [ "$attempt" -lt 3 ]; then
              echo "::warning::SonarQube Cloud scan failed on attempt ${attempt}; retrying in 20 seconds."
              sleep 20
            fi
          done

          exit 1
